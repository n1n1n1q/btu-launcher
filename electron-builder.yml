appId: net.btu.launcher
productName: BTU Launcher
directories:
  output: dist
files:
  - src/**/*
  - resources/**/*
  - package.json
# Ad-hoc signs the mac .app after packaging -- see the comment in the script
# for why: mac.identity: null below skips electron-builder's own signing (and
# with it the more commonly-used `afterSign` hook, which electron-builder
# itself skips when nothing was signed), but Apple Silicon won't launch a
# completely unsigned app at all. No-op on win/linux.
afterPack: tools/afterPack-mac-adhoc-sign.js
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png # electron-builder converts this to .ico at build time
  # Fixed, versionless name -- every release overwrites the same file at the
  # same URL on both the update feed and the downloads page, so a download
  # link never goes stale and the site never needs the version in it. The
  # ucucraft.fun downloads-page contract only cares about the manifest's
  # "windows-x86_64" build key (see docs/PUBLISHING.md), not this filename.
  artifactName: BTUSetup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    # No `arch:` here -- an arch pinned on the target itself overrides the
    # CLI's --x64/--arm64 (build.yml's two parallel macos-latest jobs), so
    # having it here made BOTH jobs build BOTH archs every time regardless
    # of which flag was passed. That's not just wasted time: each job's
    # `dist/*.dmg` glob then uploaded both dmgs under its own artifact name,
    # so deploy/publish-downloads/github-release all ended up with two
    # different builds colliding on the same filename (BTULauncher-x64.dmg,
    # BTULauncher-arm64.dmg) -- non-deterministically overwritten, and in
    # download-artifact's merge-multiple case, at risk of a concurrent-write
    # corrupting the file (surfaced as macOS's "disk image couldn't be
    # opened" error). package.json's dist:mac passes --x64 --arm64 itself
    # now so a plain local build still produces both, like before.
    - target: dmg
  category: public.app-category.games
  icon: resources/icon.png # electron-builder converts this to .icns at build time
  hardenedRuntime: false # no code signing set up yet -- see docs/SETUP.md
  identity: null # explicitly skip codesigning (would otherwise try to find a local cert)
  # Versionless, same reasoning as win.artifactName above. ${arch} (not the
  # version) is what has to stay: it resolves to "x64"/"arm64" -- distinct
  # substrings (neither is a substring of the other) so the publish workflow
  # can still tell the two dmgs apart by filename alone. Mapped to the
  # macos-x86_64/macos-arm64 build keys in docs/PUBLISHING.md; the "x64" vs
  # "x86_64" wording mismatch is only in the filename, not the manifest key.
  artifactName: BTULauncher-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Game
  icon: resources/icon.png
  # Versionless, same reasoning as win.artifactName above.
  artifactName: BTULauncher.${ext}
publish:
  # Points electron-updater at a plain directory on your VPS. After
  # `npm run dist:win`, upload the whole dist/ folder's contents (the
  # installer + latest.yml) here. See docs/SETUP.md.
  provider: generic
  url: https://updates.ucucraft.fun/launcher/ # TODO: your real update URL
