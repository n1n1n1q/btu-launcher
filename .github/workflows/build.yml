name: Build launcher

# Builds the launcher for all three OSes. electron-builder needs to run on
# (or emulate) the OS it's targeting -- macOS builds in particular basically
# require real macOS -- so this uses GitHub's hosted runners instead of
# building locally. See docs/SETUP.md Part D for the full picture.
on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: btu-launcher-${{ matrix.os }}
          # electron-builder's actual installer/output files, not the whole
          # dist/ tree (which also has unpacked build junk).
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: ignore

  # Pushes every installer built above to the update server, completing
  # docs/SETUP.md Part D without a manual scp. Only runs for an actual
  # release (a pushed v* tag) -- a workflow_dispatch run off a branch still
  # just builds artifacts for inspection, same as before.
  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all built installers
        uses: actions/download-artifact@v4
        with:
          pattern: btu-launcher-*
          path: dist
          merge-multiple: true

      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned to the update server's actual host key (see docs/SETUP.md
          # Part D2) rather than ssh-keyscan-on-the-fly, so a run can't be
          # quietly pointed at a different host.
          cat >> ~/.ssh/known_hosts <<'EOF'
          130.61.179.91 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBasx0WrhjGWtWn1AoB3tVsOAp/O2CA/iJFhWVfFJVZU
          EOF

      - name: Upload installers to updates.* /launcher/
        run: |
          rsync -av \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            dist/ ubuntu@130.61.179.91:/var/www/updates/launcher/
