name: Build launcher

# Builds the launcher for all three OSes (four jobs: macOS splits into
# separate arm64/x64 runners, see the matrix below). electron-builder needs
# to run on (or emulate) the OS it's targeting -- macOS builds in particular
# basically require real macOS -- so this uses GitHub's hosted runners
# instead of building locally. See docs/SETUP.md Part D for the full picture.
on:
  workflow_dispatch: {}
  push:
    # Every push to main builds all four installers as downloadable
    # artifacts, so a broken build surfaces at merge time rather than at
    # release time. Only a v* tag goes further: the deploy and
    # publish-downloads jobs below are gated on the tag ref, so main pushes
    # never touch the update feed or the downloads page.
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: windows
            os: windows-latest
            buildCmd: npm run dist:win
          # Split into two parallel macos-latest runners instead of one job
          # building both archs (electron-builder.yml's mac.arch default) --
          # each finishes sooner, and it's what the downloads page needs
          # anyway (two distinctly-named dmgs). The `deploy` job below has to
          # specifically account for this: each run produces its own
          # latest-mac.yml describing only its one dmg.
          - name: macos-arm64
            os: macos-latest
            buildCmd: npx electron-builder --mac --arm64
          - name: macos-x64
            os: macos-latest
            buildCmd: npx electron-builder --mac --x64
          - name: linux
            os: ubuntu-latest
            buildCmd: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: ${{ matrix.buildCmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: btu-launcher-${{ matrix.name }}
          # electron-builder's actual installer/output files, not the whole
          # dist/ tree (which also has unpacked build junk).
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: ignore

  # Pushes every installer built above to the update server, completing
  # docs/SETUP.md Part D without a manual scp. Only runs for an actual
  # release (a pushed v* tag) -- a workflow_dispatch run off a branch still
  # just builds artifacts for inspection, same as before.
  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all built installers
        uses: actions/download-artifact@v4
        with:
          pattern: btu-launcher-*
          path: artifacts

      - name: Flatten installers and merge mac update metadata
        run: |
          set -euo pipefail
          mkdir -p dist
          # Every other file has a unique name per job (electron-builder.yml's
          # artifactName templates), so it's safe to flatten those straight
          # across. latest-mac.yml is the one exception -- both macos-arm64
          # and macos-x64 jobs produce a file with that exact same name.
          find artifacts -type f ! -name 'latest-mac.yml' -exec cp {} dist/ \;

          # electron-updater's MacUpdater reads latest-mac.yml's `files:`
          # list and picks the entry whose url matches the running app's
          # arch. Each job's own latest-mac.yml only lists its one dmg, so
          # naively copying both to the same filename (last one wins) would
          # silently break auto-update for whichever arch lost -- merge their
          # `files:` arrays into one instead.
          ARM_YML=artifacts/btu-launcher-macos-arm64/latest-mac.yml
          X64_YML=artifacts/btu-launcher-macos-x64/latest-mac.yml
          npm install --no-save --no-audit --no-fund js-yaml@4
          node -e "
            const fs = require('fs');
            const yaml = require('js-yaml');
            const arm = yaml.load(fs.readFileSync('$ARM_YML', 'utf8'));
            const x64 = yaml.load(fs.readFileSync('$X64_YML', 'utf8'));
            arm.files = [...arm.files, ...x64.files];
            fs.writeFileSync('dist/latest-mac.yml', yaml.dump(arm));
          "

      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned to the update server's actual host key (see docs/SETUP.md
          # Part D2) rather than ssh-keyscan-on-the-fly, so a run can't be
          # quietly pointed at a different host.
          cat >> ~/.ssh/known_hosts <<'EOF'
          130.61.179.91 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBasx0WrhjGWtWn1AoB3tVsOAp/O2CA/iJFhWVfFJVZU
          EOF

      - name: Upload installers to updates.* /launcher/
        run: |
          # /var/www/updates/launcher/ is owned by www-data; ubuntu only has
          # write access to it via the setgid group bit from SETUP.md, not
          # ownership. -a tries to mirror owner, group, times, and
          # permissions onto the destination -- for every file inside that's
          # fine (ubuntu recreates them fresh on each deploy, so it owns them
          # and can set their attributes), but for the pre-existing top-level
          # directory entry itself ("."), setting any of those requires
          # owning the path or CAP_FOWNER, which ubuntu has neither of. Each
          # of these has failed with "Operation not permitted" on "." in
          # turn as -a tried to sync one more attribute of it:
          #   --no-owner --no-group  (chown/chgrp on ".")
          #   --omit-dir-times       (mtime on ".")
          #   --no-perms             (chmod on ".")
          # The real fix is `sudo chown ubuntu:www-data /var/www/updates/launcher`
          # on the VPS (SETUP.md Part D2) -- ubuntu then owns "." too and none
          # of this is needed. Left in place either way since it's harmless
          # once that's done.
          rsync -av --no-owner --no-group --omit-dir-times --no-perms \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            dist/ ubuntu@130.61.179.91:/var/www/updates/launcher/

  # Publishes the same installers to the public ucucraft.fun downloads page
  # (a different concern from `deploy` above, which feeds electron-updater's
  # own self-update check) -- see docs/PUBLISHING.md for the full contract
  # this job implements.
  publish-downloads:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all built installers
        uses: actions/download-artifact@v4
        with:
          pattern: btu-launcher-*
          path: dist
          merge-multiple: true

      - name: Build releases.json
        run: |
          set -euo pipefail
          cd dist
          VERSION="${GITHUB_REF_NAME#v}"

          # electron-builder.yml's artifactName templates are fixed, versionless
          # names now (BTUSetup.exe etc.) -- every release overwrites the same
          # file at the same URL, so these are literal lookups, not patterns.
          WIN=BTUSetup.exe
          MAC_ARM=BTULauncher-arm64.dmg
          MAC_X64=BTULauncher-x64.dmg
          LINUX=BTULauncher.AppImage

          entry() {
            jq -n --arg url "downloads/$1" \
                  --argjson size "$(stat -c%s "$1")" \
                  --arg sha "$(sha256sum "$1" | cut -d' ' -f1)" \
                  '{url: $url, size: $size, sha256: $sha}'
          }

          jq -n \
            --arg version "$VERSION" \
            --arg released "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson win "$(entry "$WIN")" \
            --argjson macarm "$(entry "$MAC_ARM")" \
            --argjson macx64 "$(entry "$MAC_X64")" \
            --argjson linux "$(entry "$LINUX")" \
            '{version: $version, released: $released,
              builds: {"windows-x86_64": $win,
                       "macos-arm64": $macarm,
                       "macos-x86_64": $macx64,
                       "linux-x86_64": $linux}}' > releases.json

          jq . releases.json # fails the job if the JSON came out malformed

      - name: Set up deploy key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.UCUCRAFT_SSH_KEY }}" > ~/.ssh/ucucraft_key
          chmod 600 ~/.ssh/ucucraft_key
          # Pinned to the actual server host key, same as the deploy job
          # above (both currently the same physical box).
          cat >> ~/.ssh/known_hosts <<'EOF'
          130.61.179.91 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBasx0WrhjGWtWn1AoB3tVsOAp/O2CA/iJFhWVfFJVZU
          EOF

      - name: Upload binaries, then the manifest
        env:
          HOST: ${{ secrets.UCUCRAFT_SSH_HOST }}
          USER: ${{ secrets.UCUCRAFT_SSH_USER }}
          PORT: ${{ secrets.UCUCRAFT_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          SSH="ssh -p $PORT -i ~/.ssh/ucucraft_key -o UserKnownHostsFile=~/.ssh/known_hosts"
          SITE=/home/ubuntu/ucucraft-site/public

          # 1. binaries first -- see docs/PUBLISHING.md #3 for why the order
          #    matters (the page can fetch the manifest mid-deploy). dist/
          #    also has electron-updater's own *.yml/*.blockmap metadata
          #    (that's for the deploy job's update server, not this site) and
          #    releases.json itself -- none of those belong in the public
          #    downloads folder.
          # --no-owner --no-group: see the equivalent note in the deploy job
          # above -- ubuntu can't chgrp to the runner's own uid/gid.
          rsync -av --no-owner --no-group -e "$SSH" \
            --exclude '*.yml' --exclude '*.blockmap' --exclude releases.json \
            dist/ "$USER@$HOST:$SITE/downloads/"

          # 2. manifest last, atomically: upload to a temp name, then mv
          #    in place so a visitor never sees a half-written file.
          rsync -av --no-owner --no-group -e "$SSH" dist/releases.json "$USER@$HOST:$SITE/data/releases.json.tmp"
          $SSH "$USER@$HOST" "mv $SITE/data/releases.json.tmp $SITE/data/releases.json"
